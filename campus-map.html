
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Maps</title>

    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

    <style>
        #map {
            height: 500px;
            flex: 1;
        }

        .popup-image {
            max-width: 200px;
            height: auto;
            object-fit: contain;
        }

        #location {
            width: 250px;
        }

        .location {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }

        .location:hover {
            background: #eee;
        }

        .container {
            display: flex;
            gap: 15px;
        }
    </style>
</head>

<body>
    <h1>Simple Maps</h1>

    <div class="container">
        <div id="location">
            <h3>Locations</h3>
            <div id="location-list"></div>
        </div>

        <div id="map"></div>
    </div>

    <script>
        function initMap(mapDataUrl) {
            const map = L.map('map').setView([8.360, 124.868], 17);

            const openStreetMap = L.tileLayer(
                'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap'
                }
            );

            const satellite = L.tileLayer(
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                {
                    attribution: 'Tiles &copy; Esri'
                }
            );

            satellite.addTo(map);

            fetch(mapDataUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Unable to load campus-map.json');
                    }
                    return response.json();
                })
                .then(data => {
                    data.forEach(pin => {
                        const lng = pin.lng ?? pin.long;
                        const imageUrl = pin.image ?? pin.img;

                        const marker = L.marker([
                            pin.lat,
                            lng
                        ]).addTo(map);

                        const image = imageUrl
                            ? `<img src="${imageUrl}" class="popup-image">`
                            : '';

                        marker.bindPopup(`
                            ${pin.title}
                            <br>
                            <hr>
                            ${image}
                        `);

                        const item = document.createElement('div');
                        item.className = 'location';
                        item.textContent = pin.title;

                        document.getElementById('location-list')
                            .appendChild(item);

                        item.onclick = () => {
                            map.flyTo([pin.lat, lng], 18);
                            marker.openPopup();
                        };
                    });

                    const baseMaps = {
                        "OpenStreetMap": openStreetMap,
                        "Satellite": satellite
                    };

                    L.control.layers(baseMaps).addTo(map);
                })
                .catch(error => console.error(error));
        }

        initMap('campus-map.json');
    </script>
</body>
</html>
