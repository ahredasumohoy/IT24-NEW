
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast App</title>
</head>
<body>

    <h1>Weather Forecast Application</h1>

    <h2>Select Location</h2>

    <button onclick="getGPSLocation()">Use My GPS</button>
    <button onclick="getWeather()">Manual Location</button>

    <p id="locationResult"></p>

    <hr>

    <div id="weatherResult"></div>

    <div id="forecastResult"></div>

    <script>

    const apiKey = "YOUR_OPENWEATHERMAP_API_KEY";

    // MANUAL CITY SEARCH
    async function getWeather() {

        const city = prompt("Enter a city name");

        if (!city || city.trim() === "") {
            alert("No city entered");
            return;
        }

        const url =
            `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city.trim())}&appid=${apiKey}&units=metric`;

        try {

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error("City not found");
            }

            const data = await response.json();

            // Get geographical coordinates
            const latitude = data.coord.lat;
            const longitude = data.coord.lon;

            // Display selected location
            document.getElementById("locationResult").innerHTML =
                `Selected City: ${data.name}`;

            // Pass coordinates to another function
            getWeatherByCoordinates(latitude, longitude);

        } catch (error) {

            alert("Error: " + error.message);

        }
    }

    // This function receives the coordinates
    async function getWeatherByCoordinates(lat, lon) {

        console.log("Latitude:", lat);
        console.log("Longitude:", lon);

        // Your weather and forecast API requests
        // can be added here.

    }

    </script>

</body>
</html>
