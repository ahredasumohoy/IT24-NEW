<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        #map {
            height: 500px;
            width: 100%;
        }

        .popup-image {
            max-width: 200px;
            width: 100%;
            height: auto;
        }

        .popup-title {
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Simple Map</h1>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        function initMap(mapDataUrl) {
            const map = L.map('map').setView([8.360, 124.868], 17);

            const openStreetMap = L.tileLayer(
                'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap contributors'
                }
            );

            const satellite = L.tileLayer(
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                {
                    maxZoom: 19,
                    attribution: 'Tiles &copy; Esri'
                }
            );

            satellite.addTo(map);

            L.control.layers({
                "OpenStreetMap": openStreetMap,
                "Satellite": satellite
            }).addTo(map);

            fetch(mapDataUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Cannot load campus-map.json');
                    }
                    return response.json();
                })
                .then(data => {
                    data.forEach(pin => {
                        const marker = L.marker([pin.lat, pin.long]).addTo(map);

                        const content = document.createElement('div');
                        const title = document.createElement('div');

                        title.className = 'popup-title';
                        title.textContent = pin.title || 'Untitled location';
                        content.appendChild(title);

                        if (pin.img) {
                            const image = document.createElement('img');
                            image.src = pin.img;
                            image.alt = pin.title || 'Location image';
                            image.className = 'popup-image';
                            content.appendChild(image);
                        }

                        marker.bindPopup(content);
                    });
                })
                .catch(error => console.error('Error:', error));
        }

        initMap('./campus-map.json');
    </script>
</body>
</html>
